name: Verify GANDOPS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
      - run: |
          node --check app.mjs
          node --check engine.mjs
          python -m json.tool sample.json > /dev/null
          test -s index.html
          test -s style.css
          grep -q 'type="module"' index.html
